<!doctype html>
<html><head><meta charset="utf-8"><title>Mochi Eps. 16</title>
<style>html,body{margin:0;background:#1a0f0a}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Eps. 16 — "Ke Minimarket": only needs soap -> "buy 2 get 1" -> long receipt -> forgot the soap.
const ITEMS = ['#E2483D', '#3FA7A0', '#FFD23F', '#7C6CD9', '#6CC07A', '#F2A93B', '#FF8FB1', '#E2483D', '#3FA7A0'];
function basket(x, y, n) {
  for (let i = 0; i < n; i++) { const ix = x - 120 + (i % 4) * 75, iy = y - 70 - Math.floor(i / 4) * 60; rr(ix - 30, iy - 40, 60, 80, 10); fillStroke(ITEMS[i % ITEMS.length], 6); }
  ctx.beginPath(); ctx.moveTo(x - 170, y - 60); ctx.lineTo(x + 170, y - 60); ctx.lineTo(x + 140, y + 70); ctx.lineTo(x - 140, y + 70); ctx.closePath(); fillStroke(C.red, 9);
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 6; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(x + i * 55, y - 50); ctx.lineTo(x + i * 48, y + 60); ctx.stroke(); }
}
function soapThought(x, y, s, crossed) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ell(0, 0, 150, 110); fillStroke(C.white, 9); ell(-90, 120, 22, 18); fillStroke(C.white, 6); ell(-120, 160, 12, 10); fillStroke(C.white, 5);
  rr(-70, -40, 140, 80, 30); fillStroke('#9FD8F0', 7); ctx.fillStyle = C.ink; ctx.font = `900 30px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('SABUN', 0, 2);
  if (crossed) { ctx.strokeStyle = C.red; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(-90, -70); ctx.lineTo(90, 70); ctx.moveTo(90, -70); ctx.lineTo(-90, 70); ctx.stroke(); }
  ctx.restore();
}
runEpisode({
  dur: 16,
  hook: 'MAU BELI\n1 BARANG DOANG...',
  scenes: [
    [0, 3.5, (t, lt) => {
      street(t, { scroll: .25 });
      drawCat({ x: 540, y: 1170 + Math.abs(Math.sin(t * 7)) * -30, s: 1.0, eyes: 'happy', mouth: 'smile', run: t * 9, tail: t * 4 });
      soapThought(800, 820, .9, false);
      caption('MAU BELI\nSABUN DOANG', t, .2, 430, { size: 140, hi: [1] });
      epPill(t, 16, 'KE MINIMARKET');
    }],
    [3.5, 8, (t, lt) => {
      room(t, { window: false, wallA: '#FFE8CC', wallB: '#F7C894' }); shelves(300);
      const n = Math.min(12, Math.floor(prog(lt, .8, 4) * 12));
      drawCat({ x: 380, y: 1330, s: .8, eyes: lt > .6 ? 'sparkle' : 'open', mouth: 'smile', tail: t * 5, shake: t });
      basket(780, 1400, n);
      ctx.save(); ctx.translate(800, 760); ctx.rotate(.12 + Math.sin(t * 6) * .04); const p = eBack(prog(lt, .4, .7)); ctx.scale(p, p);
      rr(-200, -80, 400, 160, 20); fillStroke(C.red, 10); ctx.fillStyle = C.white; ctx.font = `900 54px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('BELI 2', 0, -24); ctx.fillStyle = C.yellow; ctx.fillText('GRATIS 1!', 0, 34); ctx.restore();
      caption('*LIAT DISKON*', t, 3.8, 340, { size: 130, fill: C.yellow, shake: 3 });
    }],
    [8, 12, (t, lt) => {
      room(t, { window: false, wallA: '#FFE8CC', wallB: '#F7C894' });
      rr(140, 1230, 800, 250, 16); fillStroke('#7C6CD9', 10);
      const len = eOut(prog(lt, .2, 2.2)) * 980;
      ctx.save(); rr(470, 340, 150, len * .92, 4); ctx.fillStyle = C.white; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.stroke();
      ctx.fillStyle = '#B9A99A'; for (let y = 370; y < 330 + len * .92; y += 30) ctx.fillRect(485, y, 90 + (y * 7) % 30, 8); ctx.restore();
      drawCat({ x: 820, y: 1120, s: .8, eyes: lt > 2.2 ? 'wide' : 'open', mouth: lt > 2.2 ? 'scream' : 'flat', tail: t * 3, shake: lt > 2.2 ? t : 0, sweat: prog(lt, 2.2, 2.6) });
      if (lt > 2.2) { pill('TOTAL: Rp287.500', 545, 1340, C.ink, C.yellow, t, 10.2); }
      caption('STRUKNYA...\nPANJANG BANGET', t, 8.3, 190, { size: 110, hi: [1], hiColor: '#FF8A7A' });
    }],
    [12, 16, (t, lt) => {
      room(t);
      [[260, 1400], [800, 1400]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x - 130, y - 150); ctx.lineTo(x + 130, y - 150); ctx.lineTo(x + 110, y + 70); ctx.lineTo(x - 110, y + 70); ctx.closePath(); fillStroke('#F4EBDD', 9); basket; });
      drawCat({ x: 540, y: 1300, s: .9, eyes: lt < .8 ? 'happy' : 'flat', mouth: lt < .8 ? 'smile' : 'flat', tail: t, sweat: prog(lt, .9, 1.3) });
      soapThought(780, 900, .85, lt > .8);
      caption('...SABUNNYA\nKELUPAAN', t, 12.9, 430, { size: 140, hi: [1], hiColor: '#FF8A7A' });
      endCard(t, 13.6, 'TAG TEMEN YANG', 'SUKA KALAP BELANJA!');
    }],
  ],
  fx(t) { swipe(t, 3.5, .45); flash(t, 8.0, .25); iris(t, 12.0, 540, 1300, .3); },
  music: [[0, 12.7, 1], [14.0, 16, .8]],
  sfx: [['pop', .2, { f: 700 }], ['steps', .3, { t1: 3.3, every: .28, g: .2 }], ['pop', 1.0, { f: 900, g: .3 }],
    ['ding', 3.9, { f: 1568, g: .3 }], ['pop', 3.85, { f: 800 }], ['pop', 4.6, { f: 900, g: .3 }], ['pop', 4.9, { f: 950, g: .3 }], ['pop', 5.2, { f: 1000, g: .3 }], ['pop', 5.5, { f: 1050, g: .3 }], ['pop', 5.8, { f: 1100, g: .3 }], ['pop', 6.1, { f: 1150, g: .3 }], ['pop', 6.4, { f: 1200, g: .3 }], ['pop', 6.7, { f: 1250, g: .3 }],
    ['whoosh', 7.75, { d: .3, g: .4 }], ['type', 8.3, { t1: 10.2, g: .2 }], ['cash', 10.2], ['sting', 10.3, { g: .3 }], ['pop', 8.35, { f: 700 }],
    ['whoosh', 11.75, { d: .35, g: .45, up: false }], ['sad', 12.8, { g: .3 }], ['pop', 12.95, { f: 600 }], ['pop', 13.65, { f: 800, g: .4 }]],
});
</script></body></html>
