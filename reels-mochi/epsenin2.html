<!doctype html>
<html><head><meta charset="utf-8"><title>Mochi Spesial: Senin Pagi Part 2</title>
<style>html,body{margin:0;background:#1a0f0a}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Spesial — "Senin Pagi Part 2": 10 alarms -> wakes 07:50 -> sprints -> on time... still in pajamas.
const SNOOZES = ['06:00', '06:10', '06:20', '06:30', '06:40', '06:50', '07:00', '07:10', '07:20', '07:30'];
function office(t) {
  ctx.fillStyle = '#F2B47E'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.15)'; for (let yy = 0; yy < 1400; yy += 70) ctx.fillRect(0, yy, W, 6);
  for (let c = 0; c < 3; c++) { rr(90 + c * 330, 200, 240, 190, 20); fillStroke('#FFE6B3', 10); }
  rr(380, 620, 320, 70, 14); fillStroke(C.white, 8);
  ctx.font = `900 40px ${FONT}`; ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('KANTOR', 540, 657);
  ctx.fillStyle = '#B9774A'; ctx.fillRect(0, 1470, W, H - 1470); ctx.fillStyle = C.ink; ctx.fillRect(0, 1464, W, 12);
}
runEpisode({
  dur: 16,
  hook: 'SENIN PAGI\nPART 2...',
  scenes: [
    [0, 3.5, (t, lt) => {
      bedroom(t);
      const k = Math.min(9, Math.floor(lt * 3));
      alarmClock(155, 1130, .85, SNOOZES[k], Math.floor(lt * 3) !== Math.floor((lt - .1) * 3) || (lt * 3) % 1 < .4, t);
      drawCat({ x: 600, y: 1150, s: 1.1, eyes: 'closed', mouth: 'flat', tail: t, sq: Math.sin(t * 3) * .025 });
      sleepCap(600, 1150, 1.1, t);
      blanket(t, 1240, Math.sin(t * 3) * 6);
      zzz(t, 760, 980);
      pill(`SNOOZE KE-${k + 1}`, W / 2, 640, C.ink, C.yellow, t, .4);
      caption('PASANG 10 ALARM', t, .2, 420, { size: 130 });
      epPill(t, 'Spesial', 'SENIN PAGI PART 2');
    }],
    [3.5, 7, (t, lt) => {
      const sh = lt < .6 ? (1 - lt / .6) * 20 : 4;
      ctx.translate(Math.sin(t * 80) * sh, Math.cos(t * 70) * sh);
      bedroom(t);
      alarmClock(155, 1130, .85, '07:50', true, t);
      const jp = prog(lt, 0, .5);
      drawCat({ x: 600, y: 1080 - Math.sin(jp * Math.PI) * 300, s: 1.15, eyes: 'wide', mouth: 'scream', tail: t * 8, sweat: 1, shake: t });
      sleepCap(600, 1080 - Math.sin(jp * Math.PI) * 300, 1.15, t);
      blanket(t, 1300, 0);
      caption('07.50?!\nMASUK JAM 8!!', t, 3.8, 420, { size: 140, hi: [1], hiColor: '#FF8A7A', shake: 4 });
    }],
    [7, 11, (t, lt) => {
      street(t, { scroll: 1.2 });
      speedLines(t, 22, 7);
      const bob = Math.abs(Math.sin(t * 13)) * -50;
      dust(470, 1330, t, 3, 6);
      drawCat({ x: 520, y: 1170 + bob, s: 1.0, rot: .14, eyes: 'determined', mouth: 'flat', run: t * 26, toast: true, tail: t * 10, sweat: .9 });
      pajama(520, 1170 + bob, 1.0); sleepCap(520, 1170 + bob, 1.0, t);
      caption('LARI SECEPAT\nKILAT!!', t, 7.3, 430, { size: 140, hi: [1], fill: C.yellow, hiColor: C.white, shake: 4 });
    }],
    [11, 16, (t, lt) => {
      office(t);
      door(540, 1480, 0, 0);
      npcCat(170, 1360, .55, ...NPC[0], { eyes: lt > 1.5 ? 'wide' : 'open', mouth: lt > 1.5 ? 'o' : 'flat' });
      npcCat(910, 1360, .55, ...NPC[3], { eyes: lt > 1.5 ? 'wide' : 'open', mouth: lt > 1.5 ? 'o' : 'flat' });
      const proud = lt < 1.6;
      drawCat({ x: 540, y: 1290, s: .95, eyes: proud ? 'happy' : 'wide', mouth: proud ? 'smile' : 'scream', tail: t * 3, sweat: proud ? 0 : 1, shake: proud ? 0 : t });
      pajama(540, 1290, .95); sleepCap(540, 1290, .95, t);
      pill('07:59 • TEPAT WAKTU!', W / 2, 330, C.teal, C.white, t, 11.2);
      caption('...TAPI MASIH\nPAKE PIYAMA', t, 12.7, 470, { size: 140, hi: [1], hiColor: '#9FD8F0' });
      endCard(t, 13.4, 'TAG TEMEN YANG', 'PERNAH SALAH KOSTUM!');
    }],
  ],
  fx(t) { flash(t, 3.5, .3); swipe(t, 7.0, .45); iris(t, 11.0, 540, 1290, .3); },
  music: [[0, 3.4, .8], [7.0, 11, 1.1], [11.2, 12.6, 1]],
  sfx: [['alarm', 0, { t1: 3.3, g: .15 }], ['click', .35], ['click', .7], ['click', 1.05], ['click', 1.4], ['click', 1.75], ['click', 2.1], ['pop', .45, { f: 1000, g: .3 }], ['zzz', .5],
    ['alarm', 3.5, { t1: 5.0 }], ['boing', 3.55, { g: .5 }], ['sting', 3.8, { g: .35 }], ['pop', 3.85, { f: 600 }],
    ['whoosh', 6.75, { d: .5, g: .6 }], ['steps', 7.1, { t1: 10.8, every: .12, g: .3 }], ['pop', 7.35, { f: 800 }],
    ['ding', 11.2, { f: 1568, g: .3 }], ['tada', 11.25, { g: .2 }], ['scratch', 12.5], ['pop', 12.75, { f: 600 }], ['pop', 13.45, { f: 800, g: .4 }]],
});
</script></body></html>
