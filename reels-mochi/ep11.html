<!doctype html>
<html><head><meta charset="utf-8"><title>Mochi Eps. 11</title>
<style>html,body{margin:0;background:#1a0f0a}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Eps. 11 — "Antre Kasir": buys 1 item -> person ahead pays in coins -> cashier changes shift -> new long queue.
function shop(t) { room(t, { window: false, wallA: '#FFE8CC', wallB: '#F7C894' }); shelves(300); }
function counter(x) { rr(x - 200, 1250, 400, 230, 16); fillStroke('#7C6CD9', 10); rr(x - 220, 1230, 440, 40, 12); fillStroke('#5E50B5', 9); }
runEpisode({
  dur: 16,
  hook: 'KENAPA ANTREAN AKU\nSELALU PALING LAMA?',
  scenes: [
    [0, 4, (t, lt) => {
      shop(t); counter(150);
      npcCat(150, 1100, .55, ...NPC[0], { eyes: 'open' });
      [[400, 1], [610, 2], [820, 3]].forEach(([x, i], k) => npcCat(x, 1330, .55, ...NPC[i]));
      drawCat({ x: 980, y: 1330, s: .6, eyes: 'happy', mouth: 'smile', tail: t * 2 });
      chipsBag(1010, 1390, .35, .2);
      caption('ANTRE KASIR...\nCUMA BELI 1 BARANG', t, .2, 430, { size: 120, hi: [1] });
      pill('ANTREAN KE-4', 860, 1120, C.ink, C.yellow, t, 1.2);
      epPill(t, 11, 'ANTRE KASIR');
    }],
    [4, 8, (t, lt) => {
      shop(t); counter(330);
      wallClock(880, 230, 90, 600 + lt * 300);
      npcCat(330, 1100, .6, ...NPC[0]);
      // customer ahead with a mountain of goods, paying coin by coin
      for (let i = 0; i < 6; i++) { rr(160 + (i % 3) * 110, 1150 - Math.floor(i / 3) * 90, 100, 85, 10); fillStroke(['#E2483D', '#3FA7A0', '#FFD23F'][i % 3], 7); }
      npcCat(600, 1330, .65, ...NPC[2], { eyes: 'closed' });
      const coins = Math.floor(lt * 5); for (let i = 0; i < coins; i++) { ell(430 + (i % 6) * 18, 1222 - Math.floor(i / 6) * 8, 14, 6); fillStroke(C.yellow, 4); }
      drawCat({ x: 880, y: 1330, s: .65, eyes: 'flat', mouth: 'flat', tail: t, sweat: prog(lt, 1, 2) });
      bubble(560, 870, 600, 130, '"Bentar, cari receh dulu..."', 40, 40, 1);
      pill('*20 MENIT KEMUDIAN*', W / 2, 260, C.ink, C.yellow, t, 4.1);
      caption('YANG DEPAN\nBAYAR PAKE RECEH', t, 4.5, 470, { size: 120, hi: [1] });
    }],
    [8, 12, (t, lt) => {
      shop(t); counter(380);
      npcCat(380, 1100, .6, ...NPC[0], { eyes: lt > 1 ? 'happy' : 'open' });
      if (lt > 1) { ctx.save(); ctx.translate(380, 1180); ctx.rotate(-.05 + Math.sin(t * 8) * .02 * (1 - prog(lt, 1, 1.6))); rr(-160, -70, 320, 140, 16); fillStroke(C.red, 9); ctx.fillStyle = C.white; ctx.font = `900 56px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('TUTUP', 0, -18); ctx.font = `900 28px ${FONT}`; ctx.fillText('GANTI SHIFT', 0, 36); ctx.restore(); }
      drawCat({ x: 760, y: 1330, s: .7, eyes: lt > 1.1 ? 'wide' : 'happy', mouth: lt > 1.1 ? 'scream' : 'smile', tail: t * 4, shake: lt > 1.1 ? t : 0, sweat: prog(lt, 1.2, 1.6) });
      chipsBag(830, 1400, .35, .2);
      caption('GILIRAN AKU...\nKASIRNYA GANTI SHIFT', t, 9.2, 430, { size: 115, hi: [1], hiColor: '#FF8A7A' });
    }],
    [12, 16, (t, lt) => {
      shop(t); counter(150);
      npcCat(150, 1100, .55, ...NPC[1]);
      for (let i = 0; i < 5; i++) npcCat(310 + i * 135, 1330, .45, ...NPC[i % 5]);
      drawCat({ x: lerp(1250, 970, eOut(prog(lt, 0, .8))), y: 1330, s: .5, eyes: 'flat', mouth: 'flat', tail: t, run: lt < .8 ? t * 20 : -1 });
      caption('PINDAH ANTREAN...\nMULAI DARI AWAL', t, 12.5, 430, { size: 120, hi: [1] });
      endCard(t, 13.6, 'TAG TEMEN YANG', 'SELALU SALAH ANTREAN!');
    }],
  ],
  fx(t) { flash(t, 4.0, .25); swipe(t, 8.0, .45); flash(t, 12.0, .25); },
  music: [[0, 9.1, 1], [12.4, 16, .85]],
  sfx: [['pop', .2, { f: 700 }], ['pop', 1.25, { f: 1000, g: .35 }],
    ['tick', 4.1, { n: 15, g: .1 }], ['pop', 4.15, { f: 1000, g: .35 }], ['cash', 4.6, { g: .15 }], ['cash', 5.4, { g: .15 }], ['cash', 6.2, { g: .15 }], ['cash', 7.0, { g: .15 }], ['pop', 4.55, { f: 700 }],
    ['whoosh', 7.75, { d: .5, g: .6 }], ['slam', 9.0], ['sting', 9.15, { g: .35 }], ['pop', 9.25, { f: 600 }],
    ['whoosh', 11.8, { d: .3, g: .4 }], ['steps', 12.0, { t1: 12.8, every: .12, g: .25 }], ['sad', 12.9, { g: .25 }], ['pop', 12.55, { f: 700 }], ['pop', 13.65, { f: 800, g: .4 }], ['pop', 13.45, { f: 1100, g: .3 }]],
});
</script></body></html>
