<!doctype html>
<html><head><meta charset="utf-8"><title>Mochi Eps. 19</title>
<style>html,body{margin:0;background:#1a0f0a}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Eps. 19 — "Salah Kirim Chat": complains about the boss... to the boss -> "delete for everyone" -> "Pak Bos is typing..."
function bossChat(state, t) {
  const msgs = [['Siap pak, besok saya kirim', true], ['Oke Mochi', false]];
  if (state === 'sent') msgs.push(['Bos hari ini galak banget', true, '#FFD0C9']);
  if (state === 'deleted' || state === 'typing') msgs.push(['Pesan ini telah dihapus', true, '#E6DDD0']);
  chatScreen(msgs, 'PAK BOS', t);
  if (state === 'typing') { ctx.fillStyle = C.white; rr(-84, 60, 120, 34, 12); ctx.fill(); for (let i = 0; i < 3; i++) { ell(-60 + i * 22, 77 - Math.max(0, Math.sin(t * 8 - i)) * 6, 6, 6); ctx.fillStyle = '#8A7A6E'; ctx.fill(); } ctx.fillStyle = '#E6FFF6'; ctx.font = `700 13px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText('sedang mengetik...', -20, -146); }
}
runEpisode({
  dur: 16,
  hook: 'PERNAH SALAH\nKIRIM CHAT?',
  scenes: [
    [0, 4, (t, lt) => {
      room(t); sofa(560, 1450);
      drawCat({ x: 520, y: 1240, s: .95, eyes: 'determined', mouth: 'smile', tail: t * 3, sq: (Math.floor(t * 10) % 2) * .02 });
      phone(780, 1210, .6, .2, () => { const msgs = [['Tau ga sih', true]]; if (lt > 1.3) msgs.push(['Bos hari ini galak banget', true]); chatScreen(msgs, '...', t); });
      caption('CURHAT KE TEMEN...', t, .2, 430, { size: 125 });
      epPill(t, 19, 'SALAH KIRIM CHAT');
    }],
    [4, 8, (t, lt) => {
      room(t);
      zoomAt(lerp(1.15, 1, eOut(prog(lt, 0, .6))), 540, 900);
      phone(540, 940, 2.1, -.03, () => bossChat('sent', t));
      if (lt > .9) { ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 12; ctx.beginPath(); ctx.ellipse(470, 590, 230, 70, 0, 0, 7); ctx.stroke(); ctx.restore(); }
      drawCat({ x: 540, y: 1660, s: .8, eyes: lt < .9 ? 'open' : 'wide', mouth: lt < .9 ? 'flat' : 'scream', tail: t * 8, sweat: prog(lt, .9, 1.3), shake: lt > .9 ? t : 0 });
      caption('...LHO INI\nCHAT SIAPA??', t, 4.9, 250, { size: 130, hi: [1], hiColor: '#FF8A7A', shake: 4 });
    }],
    [8, 12, (t, lt) => {
      room(t);
      ctx.translate(Math.sin(t * 70) * 5 * (1 - prog(lt, 1.4, 1.8)), 0);
      phone(540, 940, 2.1, -.03, () => bossChat(lt < 1.4 ? 'sent' : 'deleted', t));
      if (lt < 1.4) { const p = eBack(prog(lt, .1, .4)); ctx.save(); ctx.translate(540, 1250); ctx.scale(p, p); rr(-300, -60, 600, 120, 24); fillStroke(C.white, 9); ctx.fillStyle = C.red; ctx.font = `900 44px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('HAPUS UNTUK SEMUA', 0, 3); ctx.restore(); }
      drawCat({ x: 540, y: 1660, s: .8, eyes: lt < 1.4 ? 'determined' : 'happy', mouth: lt < 1.4 ? 'scream' : 'smile', tail: t * 6, sweat: 1, shake: lt < 1.4 ? t : 0 });
      caption(lt < 1.4 ? 'HAPUS! HAPUS!!' : 'FIUHHH... AMAN', t, lt < 1.4 ? 8.1 : 9.4, 250, { size: 130, fill: lt < 1.4 ? C.yellow : C.white, shake: lt < 1.4 ? 5 : 0 });
    }],
    [12, 16, (t, lt) => {
      room(t);
      phone(540, 940, 2.1, -.03, () => bossChat('typing', t));
      drawCat({ x: 540, y: 1660, s: .8, eyes: 'flat', mouth: 'flat', tail: 0, sweat: 1 });
      caption('PAK BOS\nSEDANG MENGETIK...', t, 12.5, 250, { size: 120, hi: [1], hiColor: '#FF8A7A' });
      endCard(t, 13.6, 'SIAPA YANG', 'PERNAH SALAH KIRIM?');
    }],
  ],
  fx(t) { flash(t, 4.0, .25); swipe(t, 8.0, .4); flash(t, 12.0, .25); },
  music: [[0, 4.0, 1], [9.4, 11.9, .8]],
  sfx: [['pop', .2, { f: 700 }], ['type', .4, { t1: 2.6, g: .2 }], ['notif', 1.4, { g: .2, f: 1.2 }],
    ['sting', 4.85, { g: .4 }], ['heart', 5.6], ['heart', 6.0], ['heart', 6.4], ['heart', 6.8], ['heart', 7.2], ['pop', 4.95, { f: 600 }],
    ['whoosh', 7.75, { d: .4, g: .5 }], ['click', 8.3], ['click', 8.6], ['click', 8.9], ['whoosh', 9.3, { d: .3, g: .4, up: false }], ['ding', 9.45, { f: 1568, g: .25 }], ['pop', 8.15, { f: 900 }],
    ['notif', 12.2, { f: .8 }], ['heart', 12.8], ['heart', 13.3], ['heart', 13.8], ['pop', 12.55, { f: 600 }], ['pop', 13.65, { f: 800, g: .4 }]],
});
</script></body></html>
