<!doctype html>
<html><head><meta charset="utf-8"><title>Mochi Eps. 3</title>
<style>html,body{margin:0;background:#1a0f0a}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Eps. 3 — "Meeting Online": camera off, snacking -> boss asks Mochi -> "fake bad signal" -> laptop shut.
function callGrid(highlight) {
  const cols = ['#F2A93B', '#6CC07A', '#7C6CD9', '#3FA7A0'];
  for (let i = 0; i < 4; i++) {
    const x = -200 + (i % 2) * 204, y = -125 + Math.floor(i / 2) * 128;
    rr(x, y, 196, 120, 10); ctx.fillStyle = i === 3 ? '#3B2B26' : cols[i]; ctx.fill();
    if (i === 3) { ctx.fillStyle = '#FFF'; ctx.font = `900 22px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('MOCHI', x + 98, y + 50); ctx.font = `700 18px ${FONT}`; ctx.fillText('kamera off', x + 98, y + 80); }
    else { ell(x + 98, y + 52, 26, 26); ctx.fillStyle = '#FFE6C9'; ctx.fill(); ell(x + 98, y + 118, 46, 34); ctx.fill(); }
    if (highlight && i === 0) { rr(x, y, 196, 120, 10); ctx.lineWidth = 8; ctx.strokeStyle = C.yellow; ctx.stroke(); }
  }
}
function office(t, lt, opts = {}) {
  room(t, { wx: 640, wy: 300 });
  desk(1340);
  drawCat({ x: 680, y: 1140, s: 1.0, ...opts.cat });
  laptop(330, 1340, .8, opts.open !== false, () => callGrid(opts.hl));
}
runEpisode({
  dur: 16,
  hook: 'POV: KAMERA OFF\nPAS MEETING...',
  scenes: [
    [0, 4, (t, lt) => {
      const munch = Math.floor(lt * 4) % 2;
      office(t, lt, { cat: { eyes: 'happy', mouth: munch ? 'o' : 'smile', tail: t * 2, sq: munch * .03 } });
      chipsBag(930, 1255, .55, .2);
      caption('MEETING ONLINE\nJAM 9 PAGI', t, .2, 430, { size: 130, hi: [1] });
      epPill(t, 3, 'MEETING ONLINE');
      pill('KAMERA: OFF  •  MIC: MUTE', W / 2, 650, C.teal, C.white, t, 1.4);
    }],
    [4, 8, (t, lt) => {
      const sh = lt < .7 ? (1 - lt / .7) * 20 : 3;
      ctx.translate(Math.sin(t * 80) * sh, Math.cos(t * 70) * sh);
      zoomAt(lerp(1.3, 1.08, eElastic(prog(lt, 0, 1))), 600, 1150);
      office(t, lt, { hl: true, cat: { eyes: 'wide', mouth: 'scream', tail: t * 8, sweat: prog(lt, .3, .6), shake: t } });
      // dropped chip
      const fp = prog(lt, .1, .7); ctx.save(); ctx.translate(880 + fp * 40, 1150 + eIn(fp) * 180); ctx.rotate(fp * 6); ell(0, 0, 30, 22); fillStroke('#F2A93B', 6); ctx.restore();
      bubble(500, 700, 860, 200, 'Bos: "Mochi, gimana\npendapat kamu?"', 52, -180, 1);
      caption('HAH?! AKU??', t, 4.6, 400, { size: 150, fill: C.yellow, shake: 4 });
    }],
    [8, 12, (t, lt) => {
      const tap = Math.floor(lt * 10) % 2;
      office(t, lt, { cat: { eyes: 'determined', mouth: 'flat', tail: t * 6, sweat: 1, shake: t, sq: tap * .02 } });
      caption('"MAAF PAK...\nSINYALNYA\nPUTUS-PUTUS"', t, 8.3, 480, { size: 120, hi: [1, 2], hiColor: '#9FE3DC', shake: 3 });
    }],
    [12, 16, (t, lt) => {
      office(t, lt, { open: lt < .35, cat: { eyes: lt < .35 ? 'determined' : 'happy', mouth: 'smile', tail: t * 2, sweat: 1 - prog(lt, .5, 1.5), sq: lt < .6 ? .08 * Math.sin(prog(lt, .35, .6) * Math.PI) : 0 } });
      caption('AMAN...\n(KAYAKNYA)', t, 12.6, 430, { size: 140, hi: [1] });
      endCard(t, 13.9, 'SIAPA YANG', 'PERNAH NGELAKUIN INI?');
    }],
  ],
  fx(t) {
    flash(t, 4.0, .3);
    swipe(t, 8.0, .45);
    if (t >= 8 && t < 12) glitch(t, Math.floor(t * 6) % 3 === 0 ? 1.4 : .5);
    iris(t, 12.0, 680, 1140, .3);
  },
  music: [[0, 3.95, 1], [8.0, 12, .55], [12.6, 16, .85]],
  sfx: [['pop', .2, { f: 700 }], ['crunch', .5], ['crunch', 1.0], ['crunch', 1.5], ['crunch', 2.0], ['crunch', 2.5], ['crunch', 3.0], ['pop', 1.45, { f: 1000, g: .3 }],
    ['notif', 3.9], ['sting', 4.0], ['boing', 4.05, { g: .35 }], ['pop', 4.65, { f: 800 }], ['heart', 5.0], ['heart', 5.5], ['heart', 6.0], ['heart', 6.5], ['heart', 7.0],
    ['whoosh', 7.75, { d: .5, g: .6 }], ['glitch', 8.1, { d: 3.8 }], ['pop', 8.35, { f: 700 }],
    ['whoosh', 11.7, { d: .3, g: .4, up: false }], ['slam', 12.3], ['pop', 12.65, { f: 700 }], ['ding', 13.0, { f: 1568, g: .3 }], ['pop', 13.95, { f: 800, g: .4 }]],
});
</script></body></html>
