<!doctype html>
<html><head><meta charset="utf-8"><title>Mochi Kompilasi</title>
<style>html,body{margin:0;background:#1a0f0a}canvas{display:block;max-width:100vw;margin:auto}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script>
// 16:9 long-form compilation pieces: intro, per-episode title cards, side panels, polls, outro.
const CW = 1920, CH = 1080;
const EPISODES = [
  { n: 1, title: 'SENIN PAGI', q: ['TIM ALARM PERTAMA', 'TIM ALARM KETUJUH'] },
  { n: 2, title: 'TANGGAL TUA', q: ['GAJI LANGSUNG HABIS', 'MASIH ADA SISA'] },
  { n: 3, title: 'MEETING ONLINE', q: ['TIM KAMERA ON', 'TIM KAMERA OFF'] },
  { n: 4, title: 'DIET', q: ['TIM SALAD', 'TIM MARTABAK'] },
  { n: 5, title: 'KEHUJANAN', q: ['TIM BAWA PAYUNG', 'TIM NEKAT'] },
];
function T(txt, x, y, size, fill, o = {}) {
  const p = o.t0 === undefined ? 1 : eBack(prog(o.t, o.t0, o.t0 + .35)); if (p <= 0) return;
  ctx.save(); ctx.translate(x + (o.shake ? Math.sin(o.t * 90) * o.shake : 0), y); ctx.rotate(o.rot || 0); ctx.scale(p, p);
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * .2;
  ctx.strokeStyle = 'rgba(59,31,20,.5)'; ctx.strokeText(txt, size * .06, size * .09);
  ctx.strokeStyle = C.ink; ctx.strokeText(txt, 0, 0); ctx.fillStyle = fill; ctx.fillText(txt, 0, 0);
  ctx.restore();
}
function bg(t, cx = CW / 2, cy = CH / 2) {
  const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, 1300);
  g.addColorStop(0, '#FFE9B8'); g.addColorStop(.55, '#FFB86E'); g.addColorStop(1, '#E9803F');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  sunRays(cx, cy, t, '#FFF4CF', 18, 2200, .25);
}
function grade2(t) {
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,145,60,.4)'; ctx.fillRect(0, 0, CW, CH);
  ctx.globalCompositeOperation = 'multiply';
  const v = ctx.createRadialGradient(CW / 2, CH / 2, CH * .45, CW / 2, CH / 2, CW * .7);
  v.addColorStop(0, 'rgba(255,255,255,0)'); v.addColorStop(1, 'rgba(150,70,30,.5)'); ctx.fillStyle = v; ctx.fillRect(0, 0, CW, CH);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .06;
  const f = Math.floor(t * 30); ctx.translate(-(f * 137) % 540, -(f * 251) % 960); ctx.scale(2, 2);
  for (let a = 0; a < 3; a++) for (let b = 0; b < 2; b++) ctx.drawImage(grain, a * 540, b * 960);
  ctx.restore();
}
function subscribePill(x, y, t, t0 = 0) {
  const p = eBack(prog(t, t0, t0 + .35)); if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(p * (1 + Math.sin(t * 4) * .03), p * (1 + Math.sin(t * 4) * .03));
  rr(-200, -50, 400, 100, 50); fillStroke(C.red, 9);
  ctx.fillStyle = C.white; ctx.font = `900 46px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('SUBSCRIBE', 0, 3);
  ctx.restore();
}
function fades(t, dur, inD = .2, outD = .2) {
  const k = Math.max(1 - prog(t, 0, inD), prog(t, dur - outD, dur));
  if (k > 0) { ctx.fillStyle = `rgba(30,12,5,${k})`; ctx.fillRect(0, 0, CW, CH); }
}

const SEGMENTS = {
  intro: {
    dur: 6, music: [[0, 6, 1]],
    sfx: [['whoosh', 0, { d: .4, g: .5 }], ['pop', .35, { f: 700 }], ['pop', .9, { f: 900 }], ['boing', 1.4, { g: .4 }], ['pop', 2.2, { f: 1000, g: .4 }], ['ding', 2.3, { f: 1568, g: .25 }]],
    draw(t) {
      bg(t);
      confetti(t, 0, 5);
      drawCat({ x: 470, y: 640 + Math.abs(Math.sin(t * 5)) * -40 * (1 - prog(t, 3, 4)), s: 1.15, eyes: 'happy', mouth: 'smile', tail: t * 3, sq: Math.sin(t * 10) * .03 });
      T('KOMPILASI', 1240, 300, 120, C.white, { t, t0: .3, rot: -.03 });
      T('MOCHI', 1240, 470, 220, C.yellow, { t, t0: .85, rot: -.03 });
      T('SI KUCING OREN', 1240, 640, 96, C.white, { t, t0: 1.3, rot: -.03 });
      pill('VOL. 1 • 5 EPISODE PALING RELATE', 1240, 790, C.ink, C.yellow, t, 2.1);
      fades(t, 6, .25, .25);
    }
  },
  outro: {
    dur: 20, music: [[0, 20, .9]],
    sfx: [['pop', .3, { f: 700 }], ['pop', .9, { f: 900 }], ['ding', 1.2, { f: 1318.5, g: .3 }]],
    draw(t) {
      bg(t, 480, 540);
      // left: Mochi + thanks (end-screen elements go on the right half and the subscribe circle bottom-left)
      drawCat({ x: 480, y: 520, s: 1.0, eyes: 'happy', mouth: 'smile', tail: t * 3, rot: Math.sin(t * 3) * .06 });
      T('MAKASIH UDAH', 480, 140, 76, C.white, { t, t0: .3 });
      T('NONTON!', 480, 230, 96, C.yellow, { t, t0: .6 });
      T('Tonton episode lainnya', 1400, 130, 54, C.white, { t, t0: .9 });
      // placeholders that YouTube's end screen will cover
      ctx.save(); ctx.globalAlpha = .25; ctx.setLineDash([22, 16]); ctx.lineWidth = 6; ctx.strokeStyle = C.ink;
      rr(1010, 240, 780, 360, 24); ctx.stroke(); rr(1010, 650, 780, 360, 24); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.globalAlpha = .25; ctx.setLineDash([22, 16]); ctx.lineWidth = 6; ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.arc(480, 880, 130, 0, 7); ctx.stroke(); ctx.restore();
      fades(t, 20, .25, .6);
    }
  },
};
EPISODES.forEach(ep => {
  SEGMENTS['card' + ep.n] = {
    dur: 2.5, music: [[0, 2.5, .8]],
    sfx: [['whoosh', 0, { d: .35, g: .5 }], ['pop', .2, { f: 700 }], ['pop', .55, { f: 900, g: .4 }]],
    draw(t) {
      bg(t);
      T(`EPISODE ${ep.n}`, CW / 2, 420, 110, C.white, { t, t0: .15, rot: -.03 });
      T(ep.title, CW / 2, 590, 200, C.yellow, { t, t0: .5, rot: -.03 });
      swipe(t, 0, .4);
      fades(t, 2.5, .01, .15);
    }
  };
  SEGMENTS['panel' + ep.n] = { // static side panels behind the vertical episode (video sits at x 656..1263)
    dur: 1 / 30, still: true,
    draw(t) {
      bg(0.6);
      T(`EPS. ${ep.n}`, 330, 380, 130, C.white, { rot: -.04 });
      T(ep.title.split(' ')[0], 330, 520, ep.title.length > 10 ? 96 : 120, C.yellow, { rot: -.04 });
      if (ep.title.includes(' ')) T(ep.title.split(' ').slice(1).join(' '), 330, 640, 96, C.yellow, { rot: -.04 });
      drawCat({ x: 1590, y: 560, s: .75, eyes: 'happy', mouth: 'smile', tail: 1 });
      subscribePill(1590, 860, 1);
      T('MOCHI SI KUCING OREN', 1590, 230, 46, C.white);
      // frame for the video
      rr(640, -20, 640, 1120, 0); fillStroke(null, 16);
      grade2(0);
    }
  };
  SEGMENTS['poll' + ep.n] = {
    dur: 5, music: [[0, 5, .8]],
    sfx: [['whoosh', 0, { d: .3, g: .45 }], ['pop', .3, { f: 700 }], ['pop', .8, { f: 800 }], ['pop', 1.2, { f: 1000 }], ['ding', 1.3, { f: 1568, g: .2 }], ['pop', 2.0, { f: 600, g: .35 }]],
    draw(t) {
      bg(t);
      T('KAMU TIM MANA?', CW / 2, 170, 120, C.white, { t, t0: .2, rot: -.02 });
      [[0, C.teal, 'A'], [1, C.red, 'B']].forEach(([i, col, l]) => {
        const p = eBack(prog(t, .7 + i * .4, 1.05 + i * .4)); if (p <= 0) return;
        const x = i ? 1400 : 520, y = 540;
        ctx.save(); ctx.translate(x, y); ctx.scale(p, p); ctx.rotate(i ? .03 : -.03);
        rr(-380, -150, 760, 300, 40); fillStroke(col, 12);
        ctx.fillStyle = C.white; ctx.font = `900 120px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l, 0, -70);
        let fs = 72; ctx.font = `900 ${fs}px ${FONT}`; while (ctx.measureText(ep.q[i]).width > 680) { fs -= 4; ctx.font = `900 ${fs}px ${FONT}`; }
        ctx.fillText(ep.q[i], 0, 60); ctx.restore();
      });
      T('VS', CW / 2, 540, 110, C.yellow, { t, t0: 1.2 });
      drawCat({ x: CW / 2, y: 900, s: .55, eyes: 'open', mouth: 'smile', tail: t * 3, rot: Math.sin(t * 4) * .12 });
      T('TULIS DI KOMENTAR!', CW / 2, 1010, 64, C.yellow, { t, t0: 2.0 });
      fades(t, 5, .01, .2);
    }
  };
});

window.SEGMENTS = SEGMENTS;
window.renderSeg = (name, t) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, CW, CH); const s = SEGMENTS[name]; ctx.save(); s.draw(t); ctx.restore(); if (!s.still) grade2(t); };
if (!location.search.includes('render')) {
  const order = ['intro', ...EPISODES.flatMap(e => ['card' + e.n, 'panel' + e.n, 'poll' + e.n]), 'outro'];
  document.fonts.ready.then(() => { let i = 0, st = performance.now(); (function loop() { const s = SEGMENTS[order[i]]; const t = (performance.now() - st) / 1000; if (t > Math.max(s.dur, 1.5)) { i = (i + 1) % order.length; st = performance.now(); } window.renderSeg(order[i], Math.min(t, s.dur)); requestAnimationFrame(loop); })(); });
}
</script></body></html>
