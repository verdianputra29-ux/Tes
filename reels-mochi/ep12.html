<!doctype html>
<html><head><meta charset="utf-8"><title>Mochi Eps. 12</title>
<style>html,body{margin:0;background:#1a0f0a}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Eps. 12 — "Lupa Password": wrong password x5 -> reset -> "can't reuse old password" -> so it WAS right.
function loginScreen(mode, dots) {
  ctx.fillStyle = '#F4EBDD'; ctx.fillRect(-210, -131, 420, 262);
  ctx.fillStyle = C.ink; ctx.font = `900 26px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(mode === 'reset' ? 'BUAT PASSWORD BARU' : 'MASUK', 0, -95);
  rr(-160, -60, 320, 46, 10); fillStroke(C.white, 4); rr(-160, 0, 320, 46, 10); fillStroke(C.white, 4);
  ctx.font = `700 20px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = '#8A7A6E'; ctx.fillText(mode === 'reset' ? 'password baru' : 'mochi@kucing.id', -145, -37);
  ctx.fillStyle = C.ink; ctx.font = `900 26px ${FONT}`; ctx.fillText('•'.repeat(dots), -145, 25);
  rr(-80, 64, 160, 44, 12); fillStroke(C.teal, 4); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.font = `900 20px ${FONT}`; ctx.fillText(mode === 'reset' ? 'SIMPAN' : 'MASUK', 0, 87);
}
function workDesk(t, catOpts, mode, dots, wall) {
  room(t, wall || {});
  desk(1340);
  laptop(330, 1340, .8, true, () => loginScreen(mode, dots));
  drawCat({ x: 690, y: 1140, s: 1.0, ...catOpts });
}
runEpisode({
  dur: 16,
  hook: 'PASSWORD-NYA\nAPA YA...',
  scenes: [
    [0, 4, (t, lt) => {
      workDesk(t, { eyes: 'determined', mouth: 'smile', tail: t * 2, sq: (Math.floor(t * 10) % 2) * .02 }, 'login', Math.min(8, Math.floor(lt * 4)));
      caption('LOGIN DULU AH...', t, .2, 430, { size: 130 });
      caption('"gampang, hafal kok"', t, 1.3, 620, { size: 76, fill: '#FFE9C9', rot: .04 });
      epPill(t, 12, 'LUPA PASSWORD');
    }],
    [4, 8, (t, lt) => {
      ctx.translate(Math.sin(t * 60) * 4 * prog(lt, .2, .5), 0);
      workDesk(t, { eyes: lt < 2.6 ? 'determined' : 'wide', mouth: 'flat', tail: t * 6, sweat: prog(lt, .5, 1.2), shake: t }, 'login', 8);
      for (let i = 0; i < 5; i++) notif(W / 2, 520 + i * 125, 'PASSWORD SALAH', `Percobaan ke-${i + 1}`, t, 4.1 + i * .45, C.red, 820, 'x', .78);
      caption('PASSWORD SALAH (5X)', t, 4.2, 330, { size: 105, fill: '#FF8A7A', shake: 3 });
    }],
    [8, 12, (t, lt) => {
      workDesk(t, { eyes: lt < 1.6 ? 'determined' : 'wide', mouth: lt < 1.6 ? 'flat' : 'o', tail: t * 3, sweat: 1, shake: lt > 1.6 ? t : 0 }, 'reset', Math.min(8, Math.floor(lt * 5)));
      pill('LUPA PASSWORD? RESET', W / 2, 330, C.teal, C.white, t, 8.1);
      notif(W / 2, 640, 'GAGAL', 'Tidak boleh sama dgn password lama', t, 9.5, C.red, 940, '!', .9);
      caption('...BERARTI TADI\nUDAH BENER??', t, 10.1, 470, { size: 125, hi: [1], hiColor: '#FF8A7A' });
    }],
    [12, 16, (t, lt) => {
      room(t);
      desk(1340);
      laptop(330, 1340, .8, true, () => loginScreen('login', 0));
      ctx.save(); ctx.translate(690, 1220); ctx.rotate(.35); drawCat({ x: 0, y: 0, s: .95, eyes: 'flat', mouth: 'flat', tail: t * .5, sq: -.06 }); ctx.restore();
      caption('PASSWORDNYA\nAPA SIH TADI...', t, 12.4, 430, { size: 125, hi: [1] });
      endCard(t, 13.4, 'SIAPA YANG', 'PERNAH KAYAK GINI?');
    }],
  ],
  fx(t) { flash(t, 4.0, .25); swipe(t, 8.0, .45); flash(t, 12.0, .25); },
  music: [[0, 4.0, 1], [8.0, 9.45, .8], [12.3, 16, .8]],
  sfx: [['pop', .2, { f: 700 }], ['type', .4, { t1: 2.4, g: .25 }], ['pop', 1.35, { f: 900, g: .35 }],
    ['notif', 4.1, { f: .7 }], ['notif', 4.55, { f: .68 }], ['notif', 5.0, { f: .66 }], ['notif', 5.45, { f: .64 }], ['notif', 5.9, { f: .62 }], ['pop', 4.25, { f: 600 }], ['heart', 6.6], ['heart', 7.2],
    ['whoosh', 7.75, { d: .5, g: .6 }], ['pop', 8.15, { f: 1000, g: .35 }], ['type', 8.3, { t1: 9.4, g: .25 }], ['notif', 9.5, { f: .6 }], ['sting', 9.7, { g: .35 }], ['pop', 10.15, { f: 600 }],
    ['whoosh', 11.8, { d: .3, g: .4, up: false }], ['slam', 12.15, { g: .35 }], ['sad', 12.5, { g: .25 }], ['pop', 12.45, { f: 700 }], ['pop', 13.45, { f: 800, g: .4 }]],
});
</script></body></html>
