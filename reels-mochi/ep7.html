<!doctype html>
<html><head><meta charset="utf-8"><title>Mochi Eps. 7</title>
<style>html,body{margin:0;background:#1a0f0a}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Eps. 7 — "Pesan Makan": orders food -> driver goes the wrong way -> waits, falls asleep -> driver rings, Mochi sleeps through it.
function mapScreen(lt) {
  ctx.fillStyle = '#F4EBDD'; ctx.fillRect(-94, -182, 188, 362);
  ctx.strokeStyle = '#E2D3BF'; ctx.lineWidth = 14;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(-94, i * 70); ctx.lineTo(94, i * 70 + 20); ctx.stroke(); ctx.beginPath(); ctx.moveTo(i * 50, -182); ctx.lineTo(i * 50 - 20, 182); ctx.stroke(); }
  // home pin
  ctx.save(); ctx.translate(-40, 100); ell(0, 0, 18, 18); fillStroke(C.red, 4); ctx.restore();
  // driver moving AWAY
  const k = prog(lt, .3, 4);
  const dx = lerp(10, 70, k), dy = lerp(30, -150, k);
  ctx.setLineDash([8, 8]); ctx.strokeStyle = C.teal; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-40, 100); ctx.lineTo(dx, dy); ctx.stroke(); ctx.setLineDash([]);
  ell(dx, dy, 16, 16); fillStroke(C.teal, 4);
  ctx.fillStyle = C.ink; ctx.font = `900 16px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('Driver menuju lokasi', 0, -160);
  ctx.fillStyle = C.red; ctx.font = `900 22px ${FONT}`; ctx.fillText(`${(1.2 + k * 6.8).toFixed(1)} km`, 0, 165);
}
function sofa(x, y) {
  rr(x - 330, y - 200, 660, 200, 50); fillStroke('#C2563E', 11);
  rr(x - 380, y - 120, 760, 170, 40); fillStroke('#D96A50', 11);
  rr(x - 420, y - 160, 110, 220, 40); fillStroke('#C2563E', 11); rr(x + 310, y - 160, 110, 220, 40); fillStroke('#C2563E', 11);
}
function door(x, y, ring) {
  ctx.save(); if (ring) ctx.translate(Math.sin(ring * 80) * 5, 0);
  rr(x - 150, y - 560, 300, 560, [20, 20, 0, 0]); fillStroke(C.wood, 11);
  rr(x - 115, y - 520, 230, 220, 12); fillStroke(C.woodD, 7); rr(x - 115, y - 270, 230, 230, 12); fillStroke(C.woodD, 7);
  ell(x + 105, y - 280, 14, 14); fillStroke(C.yellow, 6);
  ctx.restore();
}
runEpisode({
  dur: 16,
  hook: 'DRIVERNYA KOK\nMAKIN JAUH??',
  scenes: [
    [0, 3.5, (t, lt) => {
      room(t);
      drawCat({ x: 540, y: 1300, s: 1.0, eyes: 'open', mouth: 'o', tail: t * 2, sq: Math.sin(t * 3) * .02 });
      if (lt > .4 && lt < 2.6) growl(540, 1390, t);
      phone(820, 1350, .6, .15, () => { ell(0, -40, 60, 60); ctx.fillStyle = '#F2B544'; ctx.fill(); ctx.fillStyle = C.ink; ctx.font = `900 24px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('PESANAN', 0, 70); ctx.fillText('DIBUAT', 0, 100); });
      caption('LAPER...\nPESEN MAKAN AH', t, .2, 430, { size: 140, hi: [1] });
      epPill(t, 7, 'PESAN MAKAN');
    }],
    [3.5, 8, (t, lt) => {
      room(t);
      phone(540, 980, 2.0, -.03 + Math.sin(t * 2) * .01, () => mapScreen(lt));
      drawCat({ x: 540, y: 1660, s: .8, eyes: lt < 1.6 ? 'open' : 'wide', mouth: lt < 1.6 ? 'smile' : 'scream', tail: t * 3, sweat: prog(lt, 1.6, 2), shake: lt > 1.6 ? t : 0 });
      caption('LHO... KOK\nMAKIN JAUH??', t, 5.1, 300, { size: 130, hi: [1], hiColor: '#FF8A7A', shake: 3 });
    }],
    [8, 11.5, (t, lt) => {
      room(t, { view: lt > 1.8 ? 'night' : 'sun' });
      wallClock(250, 620, 110, 720 + lt * 200);
      sofa(560, 1450);
      const sleepy = lt > 1.8;
      drawCat({ x: 560, y: 1240 + (sleepy ? 20 : 0), s: .95, eyes: sleepy ? 'closed' : 'flat', mouth: 'flat', tail: t, rot: sleepy ? -.18 : 0, sq: Math.sin(t * 3) * .03 });
      if (sleepy) zzz(t, 640, 1060);
      pill('*1 JAM KEMUDIAN*', W / 2, 330, C.ink, C.yellow, t, 8.2);
      caption('MASIH NUNGGU...', t, 8.7, 470, { size: 120 });
    }],
    [11.5, 16, (t, lt) => {
      room(t, { view: 'night', wx: 640 });
      const ring = (lt > .3 && lt < 1.3) || (lt > 1.8 && lt < 2.8) ? t : 0;
      door(200, 1480, ring);
      if (ring) { caption('TING TONG!', t, lt < 1.5 ? 11.8 : 13.3, 760, { size: 90, fill: C.yellow, rot: -.1, shake: 6 }); }
      sofa(700, 1450);
      drawCat({ x: 700, y: 1260, s: .9, eyes: 'closed', mouth: 'smile', tail: t, rot: -.18, sq: Math.sin(t * 3) * .03 });
      zzz(t, 780, 1080);
      notif(W / 2, 600, 'DRIVER', 'Kak, saya udah di depan 15 menit', t, 12.4, C.teal, 940, '>');
      caption('PAS DATENG...\nMALAH KETIDURAN', t, 14.0, 340, { size: 120, hi: [1] });
      endCard(t, 14.6, 'TAG TEMEN YANG', 'SUKA GINI!');
    }],
  ],
  fx(t) { flash(t, 3.5, .3); swipe(t, 8.0, .45); iris(t, 11.5, 560, 1240, .3); },
  music: [[0, 5.0, 1], [8.0, 11.5, .6], [14.0, 16, .8]],
  sfx: [['growl', .5, { g: .35 }], ['pop', .2, { f: 700 }], ['click', 1.2], ['notif', 1.5, { g: .25 }],
    ['whoosh', 3.3, { d: .3, g: .4 }], ['tick', 3.8, { n: 5, g: .1 }], ['sting', 5.1, { g: .35 }], ['pop', 5.15, { f: 800 }], ['growl', 6.2, { g: .3 }],
    ['whoosh', 7.75, { d: .5, g: .6 }], ['tick', 8.2, { n: 12, g: .12 }], ['pop', 8.25, { f: 1000, g: .35 }], ['pop', 8.75, { f: 700 }], ['zzz', 9.9], ['zzz', 11.0],
    ['whoosh', 11.2, { d: .35, g: .45, up: false }], ['doorbell', 11.8], ['notif', 12.4], ['doorbell', 13.3], ['zzz', 12.6], ['zzz', 14.2], ['pop', 14.05, { f: 600 }], ['pop', 14.65, { f: 800, g: .4 }]],
});
</script></body></html>
